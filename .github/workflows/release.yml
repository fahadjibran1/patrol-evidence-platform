name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version tag: $TAG"
            exit 1
          fi
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [[ "$ROOT_VERSION" != "$VERSION" && "$ROOT_VERSION" != "${VERSION%%-*}" ]]; then
            echo "Warning: tag $VERSION differs from package.json version $ROOT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Package Electron (Windows)
        run: npm run desktop:package
        env:
          APP_VERSION: ${{ needs.validate-tag.outputs.version }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ needs.validate-tag.outputs.version }}
          path: |
            out/**
            releases/**
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    needs: [validate-tag, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: Release v${{ needs.validate-tag.outputs.version }}
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
