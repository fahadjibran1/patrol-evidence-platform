name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patrol_license_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      LICENSE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patrol_license_portal_test?schema=public
      LICENSE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patrol_license_portal_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      LICENCE_STORAGE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LICENSE_SIGNING_KEY_ID: ci-test-key
      APP_VERSION: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate --schema apps/license-api/prisma/schema.prisma

      - name: Prisma migrate (test DB)
        run: npm run license-db:migrate

      - name: Lint license-api
        run: npm run lint --workspace @patrol/license-api

      - name: Unit tests (license-api)
        run: npm test --workspace @patrol/license-api

      - name: Integration tests (license-api)
        run: npm run license-api:test:integration

      - name: Build license-api
        run: npm run license-api:build

      - name: Test + build admin portal
        run: |
          npm test --workspace @patrol/license-portal
          npm run license-portal:web:build

      - name: Test + build customer portal
        run: |
          npm test --workspace @patrol/customer-portal
          npm run customer-portal:build

      - name: Root tests + build
        run: |
          npm test
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: license-stack-dist
          path: |
            apps/license-api/dist
            apps/license-portal/dist
            apps/customer-portal/dist
            packages/license-core/dist
          retention-days: 14
