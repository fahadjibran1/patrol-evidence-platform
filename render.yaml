services:
  - type: web
    name: patrolsafe-commercial-staging
    runtime: docker
    plan: free
    branch: v1.0.3-commercial-licensing
    dockerfilePath: ./docker/commercial-staging/Dockerfile
    autoDeploy: false
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PATROLSAFE_COMMERCIAL_STAGING
        value: "true"
      - key: COMMERCIAL_LEAN_STAGING_PORTALS
        value: "true"
      - key: COMMERCIAL_OUTBOX_WORKER_ENABLED
        value: "true"
      - key: COMMERCIAL_ARTIFACT_STORE
        value: database
      - key: LICENSE_API_ENABLE_SWAGGER
        value: "false"
      - key: COMMERCIAL_STRIPE_ENABLED
        value: "true"
      - key: COMMERCIAL_STRIPE_PRODUCT_ID
        value: prod_VJZKhQacoagUlL
      - key: COMMERCIAL_STRIPE_PRICE_ID
        value: price_1UIwCVH2l2t3kuR0CHN6zOaX
      - key: COMMERCIAL_STRIPE_PRICE_LOOKUP_KEY
        value: patrolsafe_annual_gbp_v1
      - key: COMMERCIAL_STRIPE_PRICE_TAX_BEHAVIOR
        value: inclusive
      - key: COMMERCIAL_TEST_ISSUER_ENABLED
        value: "true"
      - key: COMMERCIAL_TEST_SIGNING_KEY_ID
        value: test-phase6-online-key
      - key: COMMERCIAL_TEST_SIGNING_PRIVATE_KEY_FILE
        value: /etc/secrets/patrolsafe-staging-ed25519-private.pem
      - key: COMMERCIAL_RESEND_ENABLED
        value: "true"
      - key: LICENSE_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LICENCE_STORAGE_ENCRYPTION_KEY
        sync: false
      - key: LICENSE_SIGNING_KEY_ID
        value: test-phase6-online-key
      - key: COMMERCIAL_STRIPE_SECRET_KEY
        sync: false
      - key: COMMERCIAL_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COMMERCIAL_CHECKOUT_SUCCESS_URL
        sync: false
      - key: COMMERCIAL_CHECKOUT_CANCEL_URL
        sync: false
      - key: LICENSE_PORTAL_ORIGIN
        sync: false
      - key: CUSTOMER_PORTAL_ORIGIN
        sync: false
      - key: COMMERCIAL_TERMS_VERSION
        sync: false
      - key: COMMERCIAL_PRIVACY_VERSION
        sync: false
      - key: COMMERCIAL_DELIVERY_TOKEN_SECRET
        generateValue: true
      - key: COMMERCIAL_LICENCE_DOWNLOAD_BASE_URL
        sync: false
      - key: COMMERCIAL_RESEND_API_KEY
        sync: false
      - key: COMMERCIAL_RESEND_FROM
        sync: false
      - key: COMMERCIAL_RESEND_WEBHOOK_SECRET
        sync: false
