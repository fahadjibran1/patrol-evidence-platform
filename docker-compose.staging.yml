# Staging stack — containerised API, worker, portals, nginx
name: patrol-license-staging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patrol_license}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-patrol_license_portal}
    volumes:
      - patrol_license_pg_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/license-api/Dockerfile
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      PORT: 3010
      REDIS_URL: redis://redis:6379
      LICENSE_DATABASE_URL: postgresql://${POSTGRES_USER:-patrol_license}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-patrol_license_portal}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3010"

  worker:
    build:
      context: .
      dockerfile: docker/license-worker/Dockerfile
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      WORKER_ONLY: "true"
      REDIS_URL: redis://redis:6379
      LICENSE_DATABASE_URL: postgresql://${POSTGRES_USER:-patrol_license}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-patrol_license_portal}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  admin-portal:
    build:
      context: .
      dockerfile: docker/license-portal/Dockerfile
      args:
        VITE_LICENSE_API_URL: /api
    expose:
      - "80"

  customer-portal:
    build:
      context: .
      dockerfile: docker/customer-portal/Dockerfile
      args:
        VITE_LICENSE_API_URL: /api
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - admin-portal
      - customer-portal

volumes:
  patrol_license_pg_staging:
