# Staging nginx — HTTP only (TLS terminated upstream or via self-signed local certs)
upstream license_api {
  server api:3010;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~ ^/health/ {
    proxy_pass http://license_api;
    proxy_set_header Host $host;
  }

  location = /system/version {
    proxy_pass http://license_api/system/version;
  }

  location /api/ {
    limit_req zone=api_limit burst=120 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://license_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /admin/ {
    proxy_pass http://admin-portal:80/;
  }

  location / {
    proxy_pass http://customer-portal:80/;
  }
}
