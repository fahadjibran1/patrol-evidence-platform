# Upstream API (internal Docker network)
upstream license_api {
  server api:3010;
  keepalive 32;
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # Redirect HTTP → HTTPS in production (compose mounts TLS certs)
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

  # Compression
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  client_max_body_size 10m;

  # Health (public, no auth)
  location = /health/live {
    proxy_pass http://license_api/health/live;
    proxy_set_header Host $host;
    access_log off;
  }
  location = /health/ready {
    proxy_pass http://license_api/health/ready;
    proxy_set_header Host $host;
    access_log off;
  }
  location = /health/startup {
    proxy_pass http://license_api/health/startup;
    proxy_set_header Host $host;
  }
  location = /system/version {
    proxy_pass http://license_api/system/version;
    proxy_set_header Host $host;
  }

  # API
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://license_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Connection "";
  }

  location ~ ^/api/(admin/auth|customer/auth)/ {
    limit_req zone=auth_limit burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://license_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin portal
  location /admin/ {
    proxy_pass http://admin-portal:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Customer portal
  location / {
    proxy_pass http://customer-portal:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
