# Production stack — hardened reverse proxy, API, dedicated workers
name: patrol-license-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - patrol_license_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - patrol_license_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/license-api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3010
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3010"
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: docker/license-worker/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      WORKER_ONLY: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - internal

  admin-portal:
    build:
      context: .
      dockerfile: docker/license-portal/Dockerfile
      args:
        VITE_LICENSE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  customer-portal:
    build:
      context: .
      dockerfile: docker/customer-portal/Dockerfile
      args:
        VITE_LICENSE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - admin-portal
      - customer-portal
    networks:
      - internal
      - edge

networks:
  internal:
    internal: true
  edge:

volumes:
  patrol_license_pg_prod:
  patrol_license_redis_prod:
